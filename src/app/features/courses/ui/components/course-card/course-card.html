<app-card-container>
  <article
    class="group flex h-full flex-col overflow-hidden rounded-2xl border border-border bg-surface shadow-sm transition-all duration-200 ease-in-out hover:shadow-md motion-safe:hover:-translate-y-1"
  >
    <!-- Thumbnail -->
    <div class="relative aspect-video w-full overflow-hidden bg-primary-light">
      <img
        [src]="course().thumbnailUrl"
        [alt]="course().name"
        loading="lazy"
        class="h-full w-full object-cover transition-transform duration-300 ease-out motion-safe:group-hover:scale-105"
      />
      <span
        class="absolute left-3 top-3 rounded-full bg-primary px-3 py-1 text-xs font-semibold uppercase tracking-wide text-white shadow-sm"
      >
        Course
      </span>
    </div>

    <!-- Body -->
    <div class="flex flex-1 flex-col gap-2 p-5">
      <h3 class="line-clamp-2 text-base font-bold leading-snug text-text-main">
        {{ course().name }}
      </h3>

      <p class="line-clamp-2 text-sm leading-relaxed text-text-secondary">
        {{ course().description }}
      </p>

      <!-- Meta row -->
      <div class="mt-auto flex items-center gap-4 border-t border-border pt-4">
        <span class="inline-flex items-center gap-1.5 text-sm text-text-secondary">
          <svg lucideClock [size]="16" [strokeWidth]="1.5" class="text-primary"></svg>
          <span class="font-medium text-text-main">{{ course().totalHours }}</span>
          <span>hrs</span>
        </span>

        <span class="inline-flex items-center gap-1.5 text-sm text-text-secondary">
          <svg lucidePlayCircle [size]="16" [strokeWidth]="1.5" class="text-primary"></svg>
          <span class="font-medium text-text-main">{{ course().totalVideos }}</span>
          <span>videos</span>
        </span>
      </div>
    </div>
  </article>
</app-card-container>
