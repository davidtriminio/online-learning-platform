<main
  role="status"
  aria-live="polite"
  class="grid min-h-dvh place-items-center bg-bg-page px-5 py-10 text-text-main"
>
  <div
    class="flex w-full max-w-sm flex-col items-center gap-4 rounded-2xl border border-border bg-surface px-8 py-10 text-center shadow-sm"
  >
    @if (status() === 'error') {
      <span class="grid h-14 w-14 place-items-center rounded-2xl bg-danger/10 text-danger">
        <svg lucideCircleAlert [size]="28" [strokeWidth]="1.5"></svg>
      </span>

      <h1 class="text-lg font-bold text-text-main">No se pudo iniciar el modo demo</h1>
      <p class="text-sm text-text-secondary">
        Ocurrió un problema al preparar la sesión de demostración.
      </p>

      <a
        routerLink="/login"
        class="mt-2 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:shadow-md motion-safe:hover:scale-[1.01] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-2 focus-visible:ring-offset-bg-page"
      >
        <svg lucideArrowRight [size]="18" [strokeWidth]="2"></svg>
        <span>Ir a iniciar sesión</span>
      </a>
    } @else {
      <span class="grid h-14 w-14 place-items-center rounded-2xl bg-primary-light text-primary">
        <svg lucideLoaderCircle [size]="28" [strokeWidth]="2" class="motion-safe:animate-spin"></svg>
      </span>

      <h1 class="text-lg font-bold text-text-main">Entrando en modo demo…</h1>
      <p class="text-sm text-text-secondary">
        Preparando tu sesión de demostración. Un momento.
      </p>
    }
  </div>
</main>
