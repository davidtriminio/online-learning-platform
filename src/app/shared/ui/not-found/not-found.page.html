<main
  class="mx-auto flex min-h-[70vh] w-full max-w-2xl flex-col items-center justify-center px-5 py-12 text-center"
  aria-labelledby="nf-title"
>
  <span
    class="mb-6 grid h-16 w-16 place-items-center rounded-2xl bg-primary-light text-primary shadow-sm"
  >
    <svg lucideCompass [size]="32" [strokeWidth]="1.5"></svg>
  </span>

  <p class="text-7xl font-black leading-none tracking-tight text-primary sm:text-8xl">404</p>

  <h1 id="nf-title" class="mt-4 text-2xl font-black tracking-tight text-text-main sm:text-3xl">
    Page not found
  </h1>

  <p class="mt-3 max-w-md text-sm leading-relaxed text-text-secondary">
    The page you're looking for doesn't exist or may have been moved. Let's get you back on track.
  </p>

  <div class="mt-8 flex w-full flex-col gap-3 sm:w-auto sm:flex-row">
    <a
      routerLink="/courses"
      class="inline-flex items-center justify-center gap-2 rounded-xl bg-primary px-5 py-3 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:shadow-md motion-safe:hover:scale-[1.01] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-2 focus-visible:ring-offset-bg-page"
    >
      <svg lucideArrowLeft [size]="18" [strokeWidth]="2"></svg>
      <span>Back to courses</span>
    </a>

    <a
      routerLink="/my-courses"
      class="inline-flex items-center justify-center gap-2 rounded-xl border border-border bg-surface px-5 py-3 text-sm font-semibold text-text-main shadow-sm transition-colors duration-200 hover:bg-primary-light hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-2 focus-visible:ring-offset-bg-page"
    >
      <svg lucideGraduationCap [size]="18" [strokeWidth]="2"></svg>
      <span>My courses</span>
    </a>
  </div>
</main>
