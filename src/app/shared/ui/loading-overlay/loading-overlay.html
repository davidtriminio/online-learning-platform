@if (loading.isLoading()) {
  <div
    role="status"
    aria-live="polite"
    aria-busy="true"
    class="fixed inset-0 z-[100] flex items-center justify-center bg-bg-page/70 backdrop-blur-sm"
  >
    <div
      class="flex flex-col items-center gap-3 rounded-2xl border border-border bg-surface px-8 py-6 shadow-xl"
    >
      <svg lucideLoaderCircle class="h-8 w-8 text-primary motion-safe:animate-spin"></svg>
      <span class="text-sm font-semibold text-text-secondary">Loading…</span>
    </div>
  </div>
}
