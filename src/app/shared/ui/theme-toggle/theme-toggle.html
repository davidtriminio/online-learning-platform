<button
  appButton
  type="button"
  (click)="theme.cycle()"
  [attr.aria-label]="'Theme: ' + theme.theme()"
  [attr.title]="'Theme: ' + theme.theme()"
  class="grid h-10 w-10 place-items-center rounded-xl border border-border bg-surface text-text-secondary shadow-sm transition-colors duration-200 hover:bg-primary-light hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-2 focus-visible:ring-offset-bg-page"
>
  @switch (theme.theme()) {
    @case ('light') {
      <svg lucideSun [size]="18" [strokeWidth]="2"></svg>
    }
    @case ('dark') {
      <svg lucideMoon [size]="18" [strokeWidth]="2"></svg>
    }
    @default {
      <svg lucideMonitor [size]="18" [strokeWidth]="2"></svg>
    }
  }
</button>
